<style>
  html, body { margin: 0; height: 100%; background: #0d0a14; overflow: hidden; }
  body { font-variant-numeric: tabular-nums; }
  canvas { display: block; margin: 0 auto; }
</style>

<body>
<canvas id="game"></canvas>
<!--
  Where things live (plain scripts, no build step, plays from a double-click):
    config.js            the global balance knobs (sliders)
    data/*.js            the content: map, buildings, people (classes, units, traps, trade, shopkeepers), gear, battle cards, enemies, raids, quests
    assets/manifest.js   images that replace the drawn sprites (see assets/ASSET-GUIDE.md)
    js/art.js            every sprite, drawn in code, and the image loader
    js/ui.js             text, buttons, panels
    js/mapgen.js         the land, drawn from a seed: biomes, trees, rocks
    js/village.js        the land the player shapes, building, production
    js/hero.js           the hero, his gear, idle missions
    js/quests.js         conditions, quests, rewards
    js/units.js          the citizens put to work: workers on their own, soldiers under orders
    js/raid.js           raids, the raiders' ways, towers, walls
    js/camp.js           the goblin camp: its garrison, the soldiers' assault, its fall and the next camp
    js/city.js           the city's rank, the citizens' orders, the hero's popularity, the taxes, the great works, the legacy tree (data/city.js)
    js/explore.js        the fog over the land, the places found in it, the expeditions (data/explore.js)
    js/venue.js          the places entered full screen (café, market, forge), their keeper and their mini-games (data/venues.js)
    js/cards.js          the hero's deck, read from the village (cards in data/cards.js)
    js/battle.js         the turn-based battle, played with those cards, and the parry
    js/world.js          drawing the village: ground by pieces, zoom, what stands on it
    js/save.js           save, load, export, import, away earnings
    js/tutorial.js       Aveline's teaching: the guided start of a first game, then a lesson for each thing the game opens, and their book (all in data/tutorial.js)
    js/tuto-check.js     whether that teaching still covers the whole game (also: node tools/check-tutorial.js)
    js/siting.js         where she suggests building, scored against the village as it is (also: node tools/check-siting.js)
    js/screens.js        the screens: title, village, battle, pause, figures
-->
<script src="config.js"></script>
<script src="data/world.js"></script>
<script src="data/buildings.js"></script>
<script src="data/people.js"></script>
<script src="data/items.js"></script>
<script src="data/cards.js"></script>
<script src="data/enemies.js"></script>
<script src="data/quests.js"></script>
<script src="data/tutorial.js"></script>
<script src="data/strings.js"></script>
<script src="data/city.js"></script>
<script src="data/venues.js"></script>
<script src="data/explore.js"></script>
<script src="assets/manifest.js"></script>
<script>
'use strict';
// The one-shot's starter: only what the checks read. Keep the fixed step, the clock hook,
// window.game and the play and figures scenes. The game itself is in js/*.js.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;            // simulation step in seconds; motion is per second, never per frame
const W = 1280, H = 720;        // logical size: panels and text are laid out and drawn sharp at this size
const AW = 640, AH = 360;       // the pixel-art world's native view, at a 1280x720 window
const PIXEL = true;             // pixel look: every art pixel covers a whole number of screen pixels, no smoothing
let SCALE = 1, ART = 2, PX = 2; // set by fit(): screen pixels per logical unit; screen pixels per art pixel (always whole);
                                // logical units per art pixel (2, or close to it when the window is not a multiple of 640x360)
const FONT = '"Trebuchet MS", "Segoe UI", Verdana, sans-serif';
const TITLE_FONT = 'Georgia, "Times New Roman", serif';
const TITLE = 'Aubeval';
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap'; // a headless shot or check; players never see it
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const events = []; // window.game.events: anything the game wants a run to see
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---- Screen ---------------------------------------------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
// The game always fills the window: panels and text scale freely and stay sharp. The pixel art
// does not: an art pixel is always a whole number of screen pixels, so at an in-between window
// size the village shows a little more or a little less of the map instead of uneven pixels.
function fit() {
  const dpr = devicePixelRatio || 1;
  const k = Math.max(0.1, Math.min(innerWidth / W, innerHeight / H));
  SCALE = k * dpr;
  ART = Math.max(1, Math.round(SCALE * 2));
  PX = ART / SCALE;
  canvas.width = Math.round(W * SCALE); canvas.height = Math.round(H * SCALE);
  canvas.style.width = Math.round(W * k) + 'px'; canvas.style.height = Math.round(H * k) + 'px';
  canvas.style.marginTop = Math.max(0, Math.floor((innerHeight - H * k) / 2)) + 'px';
  canvas.style.imageRendering = 'pixelated';
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0); ctx.imageSmoothingEnabled = false;
}
addEventListener('resize', fit); fit();
const snap = v => Math.round(v * SCALE) / SCALE; // a logical position, moved onto a whole screen pixel
/** Draws a sprite with its top-left at a logical point, each art pixel a whole number of screen pixels. */
function blit(img, x, y, k = 1) { ctx.drawImage(img, snap(x), snap(y), img.width * PX * k, img.height * PX * k); }
function clear(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function text(s, x, y, size, c, align = 'center', bold = false, font = FONT) {
  ctx.fillStyle = c; ctx.font = `${bold ? 'bold ' : ''}${size}px ${font}`; ctx.textAlign = align;
  ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}

// ---- Input: keys by position (event.code), OS key repeat ignored ------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code); // true for one step after the key goes down
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
addEventListener('blur', () => { down.clear(); mouse.down = false; });

// The pointer, in logical units. A press and release without dragging is a click; clicks wait
// in `clicks` for the next step, so the game's logic only ever runs on the step.
const mouse = { x: -1, y: -1, down: false, px: 0, py: 0, drag: false, ddx: 0, ddy: 0, wheel: 0 }; // wheel: notches turned since the last step, away from the player counted negative
const clicks = [];
function pointerAt(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
let sawPointer = false; // a press seen as a pointer event: the click event that follows it is the same gesture
canvas.addEventListener('pointerdown', e => {
  startAudio();
  const p = pointerAt(e); mouse.x = p.x; mouse.y = p.y;
  if (e.button === 2) { clicks.push({ x: p.x, y: p.y, button: 2 }); return; }
  sawPointer = true;
  mouse.down = true; mouse.drag = false; mouse.px = p.x; mouse.py = p.y;
});
canvas.addEventListener('click', e => { // a click that came with no pointer events (a script, an assistive tool) still counts
  if (!sawPointer) { startAudio(); const p = pointerAt(e); mouse.x = p.x; mouse.y = p.y; mouse.px = p.x; mouse.py = p.y; clicks.push({ x: p.x, y: p.y, button: 0 }); }
  sawPointer = false;
});
addEventListener('pointermove', e => {
  const p = pointerAt(e);
  if (mouse.down) {
    if (!mouse.drag && Math.hypot(p.x - mouse.px, p.y - mouse.py) > 10) mouse.drag = true;
    if (mouse.drag) { mouse.ddx += p.x - mouse.x; mouse.ddy += p.y - mouse.y; }
  }
  mouse.x = p.x; mouse.y = p.y;
});
addEventListener('pointerup', e => {
  if (!mouse.down) return;
  mouse.down = false;
  if (!mouse.drag) clicks.push({ x: mouse.px, y: mouse.py, button: 0 });
  mouse.drag = false;
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => { // the zoom: read on the next step, like every other input
  e.preventDefault();
  const p = pointerAt(e); mouse.x = p.x; mouse.y = p.y; mouse.wheel += Math.sign(e.deltaY);
}, { passive: false });

// ---- Audio: started on first input, mute on M --------------------------------------------
let audio = null, muted = false;
function startAudio() {
  if (!audio) {
    const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)(); // a check may inject one
    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
    out.connect(ac.destination); audio = { ac, out };
  }
  if (audio.ac.state === 'suspended') audio.ac.resume();
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted)); // the tweak panel (an add-on), when added, moved a value: the volume follows
function tone(freq, dur, type = 'square', vol = 0.3, delay = 0) {
  if (!audio || muted) return;
  const t = audio.ac.currentTime + delay, o = audio.ac.createOscillator(), g = audio.ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur);
}
// Each sound is a few notes: [frequency, length, wave, volume, delay].
const SFX = {
  click: [[660, .05, 'square', .1]],
  chop: [[190, .06, 'square', .22], [120, .09, 'triangle', .22, .04]],
  place: [[110, .12, 'triangle', .4], [70, .2, 'sine', .4, .03]],
  coin: [[990, .06, 'square', .1], [1320, .1, 'square', .1, .06]],
  hit: [[170, .08, 'sawtooth', .22]],
  crit: [[230, .06, 'sawtooth', .28], [115, .18, 'sawtooth', .28, .05]],
  hurt: [[95, .16, 'square', .22]],
  guard: [[320, .06, 'triangle', .2]],
  heal: [[523, .1, 'sine', .2], [784, .16, 'sine', .2, .09]],
  warn: [[392, .12, 'square', .16], [370, .2, 'square', .16, .12]],
  horn: [[147, .5, 'sawtooth', .2], [110, .9, 'sawtooth', .2, .45]],
  fanfare: [[523, .1, 'square', .13], [659, .1, 'square', .13, .1], [784, .1, 'square', .13, .2], [1047, .35, 'square', .13, .3]],
  level: [[659, .08, 'triangle', .25], [880, .08, 'triangle', .25, .08], [1319, .28, 'triangle', .25, .16]],
  error: [[140, .12, 'square', .12]],
  forge: [[880, .04, 'square', .12], [660, .12, 'triangle', .2, .05]],
  lose: [[220, .2, 'sawtooth', .18], [165, .2, 'sawtooth', .18, .2], [110, .5, 'sawtooth', .18, .4]],
  unlock: [[784, .08, 'triangle', .2], [1047, .18, 'triangle', .2, .08]],
  arrow: [[1200, .03, 'triangle', .06]],
};
function sfx(name) { const s = SFX[name]; if (s) for (const [f, d, ty, v, at] of s) tone(f, d, ty, v, at || 0); }

// ---- Scenes (js/screens.js): loading, title, play (the village), battle, pause, figures --------
// figures: every enemy kind and unit side by side, for the outline check (?scene=figures).
// The checks look for play by name.
let scene, state;
</script>
<script src="js/art.js"></script>
<script src="js/ui.js"></script>
<script src="js/mapgen.js"></script>
<script src="js/village.js"></script>
<script src="js/hero.js"></script>
<script src="js/cards.js"></script>
<script src="js/quests.js"></script>
<script src="js/units.js"></script>
<script src="js/raid.js"></script>
<script src="js/camp.js"></script>
<script src="js/city.js"></script>
<script src="js/explore.js"></script>
<script src="js/venue.js"></script>
<script src="js/minigames.js"></script>
<script src="js/battle.js"></script>
<script src="js/world.js"></script>
<script src="js/save.js"></script>
<script src="js/tuto-check.js"></script>
<script src="js/siting.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/screens.js"></script>
<script>
'use strict';
function reset() {
  seed = Number(params.get('seed')) || CONFIG.seed;
  state = Village.fresh(); // a new game: state.score is the gold earned, state.gained the last milestone
  Village.sync(); resetUi(); // the land for this game's seed, with nothing changed on it yet
}

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
let uiStale = true; // true when the game has stepped since the buttons were last laid out by a draw
const keyScript = (params.get('keys') || '').split(',').filter(Boolean); // ?keys=Digit2,Enter,x,Space: keys pressed one every half second (x: none), for a screenshot of a battle under way
let keyIn = 90;
function step() {
  if (keyScript.length && --keyIn <= 0) { hit.add(keyScript.shift()); keyIn = 30; }
  if (pressed('KeyM') || pressed('Semicolon')) { setMuted(!muted); hit.delete('KeyM'); hit.delete('Semicolon'); }
  // A click is tested against the buttons the last draw laid out. When steps run without a draw
  // between them (a slow frame, a stepped run), lay them out again first, so a click always
  // meets the screen as it is now.
  if (clicks.length && uiStale) drawFrame();
  scenes[scene].update(STEP);
  hit.clear(); clicks.length = 0; mouse.ddx = 0; mouse.ddy = 0; mouse.wheel = 0; uiStale = true;
}
let last, acc = 0, ALPHA = 1; // ALPHA: how far the frame is between the last two steps
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now; // a stall never fast-forwards the game
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP; // draw between steps, so the view never judders
  drawFrame();
}
function drawFrame() { UI.begin(); scenes[scene].draw(); UI.end(); uiStale = false; }
function frame() { tick(); requestAnimationFrame(frame); }
// A headless browser on a time budget runs timers but almost no animation frames: a timer
// ticks when no frame has come for 100 ms on a visible page; a hidden tab stays paused.
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; }, // the loop steps; a check empties it
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
Art.loadOverrides(id => { if (id.startsWith('iso.tile')) World.reset(); }); // a ground image just loaded: the painted ground is painted again
scene = params.get('scene') || 'title';
if (params.get('demo')) { buildDemo(); if (scene === 'title') scene = 'play'; }
if (params.get('tuto')) { Tuto.jump(params.get('tuto')); if (scene === 'title') scene = 'play'; } // ?tuto=forge: a new game opened at that step of the tutorial
if (params.get('lesson')) { Tuto.lessonNow(params.get('lesson')); if (scene === 'title') scene = 'play'; } // ?lesson=decor: that lesson of Aveline's opened at once (with &demo=1: on a grown village)
TutoCheck.lines(TutoCheck.run(DATA)).forEach(l => console.warn(l)); // the tutorial must cover the whole game: what it misses is said here (js/tuto-check.js)
if (scene === 'title' && ((!params.has('scene') && params.get('manual') !== '1' && !CHEAP) || params.has('loading'))) scene = 'loading'; // a player's start: the images first (js/screens.js), then the title. ?loading=0.45 holds it there, for a screenshot
if (Number(params.get('zoom')) > 0) state.cam.k = Number(params.get('zoom')); // ?zoom=0.5: open at this zoom, for a screenshot of the wide map
if (scene === 'battle') Battle.start((params.get('foes') || 'gobelin,brute,chaman').split(',').filter(id => DATA.enemies[id]), { title: 'Aperçu du combat', boss: params.has('boss') }); // ?scene=battle&foes=grakk&boss, with &demo=1 for a grown village's deck
if (scene === 'venue') Venue.preview(params.get('venue'), params.get('game')); // ?scene=venue&venue=cafe|market|forge, &game=1 for its mini-game under way (js/venue.js preview lists the rest)
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
</body>
</html>
